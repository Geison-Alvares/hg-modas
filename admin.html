<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luz Serena — Painel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo">Luz Serena</a>
      <span class="admin-title">Painel Admin</span>
      <button id="logoutBtn" class="btn btn--primary" type="button" hidden>Sair</button>
    </div>
  </header>

  <main class="admin">

    <section id="loginSection" class="admin-login">
      <h1>Entrar</h1>
      <form id="loginForm" class="admin-form">
        <label>
          E-mail
          <input type="email" id="loginEmail" required>
        </label>
        <label>
          Senha
          <input type="password" id="loginPassword" required>
        </label>
        <button type="submit" class="btn btn--primary">Entrar</button>
        <p id="loginError" class="admin-error" hidden></p>
      </form>
    </section>

    <section id="adminSection" class="admin-panel" hidden>
      <h1 id="formTitle">Adicionar produto</h1>

      <form id="produtoForm" class="admin-form">
        <input type="hidden" id="produtoId">

        <label>
          Nome do produto
          <input type="text" id="campoNome" required>
        </label>

        <label>
          Preço (R$)
          <input type="number" id="campoPreco" min="0" step="0.01" required>
        </label>

        <label class="admin-checkbox">
          <input type="checkbox" id="campoTamanhoUnico">
          Produto de variação única
        </label>

        <label id="tamanhosWrapper">
          Variações disponíveis <small>(separe por vírgula, ex: 90g, 160g ou aromas)</small>
          <input type="text" id="campoTamanhos" placeholder="90g, 160g" required>
        </label>

        <label>
          Categoria
          <select id="campoCategoria" required>
            <option value="Velas Aromáticas">Velas Aromáticas</option>
            <option value="Velas Decorativas">Velas Decorativas</option>
            <option value="Kits e Presentes">Kits e Presentes</option>
          </select>
        </label>

        <label>
          Foto do produto
          <input type="file" id="campoImagem" accept="image/*">
        </label>

        <img id="previewAtual" class="admin-preview" alt="Foto atual do produto" hidden>

        <div class="admin-form__actions">
          <button type="submit" class="btn btn--primary" id="submitBtn">Salvar produto</button>
          <button type="button" class="btn" id="cancelarEdicaoBtn" hidden>Cancelar edição</button>
        </div>

        <p id="formStatus" class="admin-status" hidden></p>
      </form>

      <h2>Produtos cadastrados</h2>
      <div id="listaProdutos" class="admin-product-list"></div>
    </section>

  </main>

  <script type="module" src="admin.js?v=6"></script>
</body>
</html>
